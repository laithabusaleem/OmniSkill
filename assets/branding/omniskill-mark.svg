<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">OmniSkill mark</title>
  <desc id="desc">Minimal geometric mark suggesting modular skill routing: a central node with four connected modules.</desc>
  <!-- Works on light (#F4F6F8) and dark (#0F1419) backgrounds -->
  <rect width="64" height="64" rx="12" fill="#0F1419"/>
  <g fill="none" stroke="#3DDC97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="5" fill="#3DDC97" stroke="none"/>
    <path d="M32 27V14"/>
    <path d="M32 37V50"/>
    <path d="M27 32H14"/>
    <path d="M37 32H50"/>
    <rect x="10" y="10" width="8" height="8" rx="1.5" fill="#E8EEF2" stroke="none"/>
    <rect x="46" y="10" width="8" height="8" rx="1.5" fill="#E8EEF2" stroke="none"/>
    <rect x="10" y="46" width="8" height="8" rx="1.5" fill="#E8EEF2" stroke="none"/>
    <rect x="46" y="46" width="8" height="8" rx="1.5" fill="#E8EEF2" stroke="none"/>
  </g>
</svg>
